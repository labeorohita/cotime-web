<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dovabl</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6366F1;
      --border-accent: #6366F1;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: #0F172A;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-top: 18vh;
      padding: 0 20px;
    }

    .logo {
      font-size: 72px;
      font-weight: 500;
      letter-spacing: -2px;
      margin-bottom: 16px;
      animation: fadeIn 1.2s ease forwards;
    }

    .tagline {
      font-size: 18px;
      font-weight: 300;
      opacity: 0.65;
      margin-bottom: 40px;
      animation: fadeIn 1.6s ease forwards;
    }

    .cta-button {
      background: var(--primary);
      color: #ffffff;
      padding: 14px 34px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
      animation: fadeIn 2s ease forwards;
    }

    .cta-button:hover {
      background: #5458EE;
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(99, 102, 241, 0.35);
    }

   footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px 0 40px;
      border-top: 2px solid var(--border-accent);
      font-size: 13px;
      opacity: 0.6;
      background: #ffffff;
    }

    /* Safe area support for iOS + modern browsers */
    @supports (padding: max(0px)) {
      footer {
        padding-bottom: max(40px, env(safe-area-inset-bottom));
      }
    }

    footer a {
      color: inherit;
      text-decoration: none;
      margin: 0 12px;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .logo {
        font-size: 48px;
      }
    }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="content">
  <div class="logo">dovabl</div>
  <div class="tagline">
    Have time? Make it real.
  </div>

  <button class="cta-button"
    onclick="window.location.href='mailto:contact@doval.com?subject=Request Access to Dovabl&body=Hi Dovabl team,%0D%0A%0D%0AI would like to request early access.'">
    Request Access
  </button>
</div>

<footer>
  © 2026 Doval
  <a href="/privacy/">Privacy</a>
  <a href="/terms/">Terms</a>
</footer>

<script>
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');

  let width, height;
  let dots = [];

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }

  window.addEventListener('resize', resize);
  resize();

  const DOT_COUNT = 60;

  class Dot {
    constructor() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.radius = 1.5;
    }

    move() {
      this.x += this.vx;
      this.y += this.vy;

      if (this.x < 0 || this.x > width) this.vx *= -1;
      if (this.y < 0 || this.y > height) this.vy *= -1;
    }

    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(99, 102, 241, 0.6)';
      ctx.fill();
    }
  }

  function drawConnections() {
    for (let i = 0; i < dots.length; i++) {
      for (let j = i + 1; j < dots.length; j++) {
        const dx = dots[i].x - dots[j].x;
        const dy = dots[i].y - dots[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 90) {
          ctx.beginPath();
          ctx.moveTo(dots[i].x, dots[i].y);
          ctx.lineTo(dots[j].x, dots[j].y);
          ctx.strokeStyle = 'rgba(99, 102, 241, 0.08)';
          ctx.stroke();
        }
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, width, height);

    dots.forEach(dot => {
      dot.move();
      dot.draw();
    });

    drawConnections();
    requestAnimationFrame(animate);
  }

  function init() {
    dots = [];
    for (let i = 0; i < DOT_COUNT; i++) {
      dots.push(new Dot());
    }
  }

  init();
  animate();
</script>

</body>
</html>
